name: 9Slides
description: 9Slides was a cloud-based presentation platform, founded by Ruchit Garg in 2011, that let
  users combine slide decks (PowerPoint, PDF, Keynote, Prezi, Excel) with synchronized video and deliver
  them through an HTML5 player viewable on desktop, tablet, and mobile. It operated on a freemium model,
  charging for premium features such as an ad-free player, password-protected presentations, and viewer
  analytics, and later pivoted toward learning and training. Backed by 500 Global, the company was
  acquired by employee-engagement platform Limeade. The 9slides.com domain no longer serves the product
  and now resolves to a parked/redirect landing page; no public API, developer portal, SDK, or documentation
  is currently published.
